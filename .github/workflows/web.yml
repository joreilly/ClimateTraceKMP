name: Web CI

# Builds the wasm web app on every PR, so problems like a stale kotlin-js-store/wasm/yarn.lock show up
# here rather than only when the manual build-and-publish-web workflow is run.
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 24
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 24
      - uses: gradle/actions/setup-gradle@v6
      - name: Build web app
        run: ./gradlew :composeApp:wasmJsBrowserDistribution
